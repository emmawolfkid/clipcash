{% load i18n %}
<form class="language-form" method="post" action="{% url 'set_language' %}">{% csrf_token %}
  <input name="next" type="hidden" value="{{ request.get_full_path }}">
  <label class="visually-hidden" for="language-select">{% translate "Language" %}</label>
  <select id="language-select" name="language">
    {% get_available_languages as LANGUAGES %}{% get_current_language as LANGUAGE_CODE %}
    {% for code, name in LANGUAGES %}<option value="{{ code }}"{% if code == LANGUAGE_CODE %} selected{% endif %}>{{ name }}</option>{% endfor %}
  </select>
  <button type="submit" class="button--link">{% translate "Change" %}</button>
</form>
