{# Decorative state marker; the page heading and text communicate the outcome. #}
<div class="auth-state auth-state--{{ kind|default:'info' }}" aria-hidden="true">
<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" focusable="false">
{% if kind == "success" %}<path d="m5 12 4 4L19 6"/>{% elif kind == "warning" or kind == "error" %}<path d="M12 4 2 21h20L12 4m0 6v4m0 3h.01"/>{% else %}<rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 7 9 6 9-6"/>{% endif %}
</svg></div>
