{# ADMIN-01: one console menu entry. Context: target (URL name), label, key (compared with console_active); nav_external=True for Django admin and account pages, which are never the current console page. #}{% url target as href %}<li><a class="app-nav__link{% if key == console_active and not nav_external %} is-current{% endif %}"{% if key == console_active and not nav_external %} aria-current="page"{% endif %} href="{{ href }}">{{ label }}{% if nav_badge %} <span class="badge badge--pending">{{ nav_badge }}</span>{% endif %}</a></li>
